<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llega-Ya | Sistema de Gestión de Entregas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0b1220;color:#fff;min-height:100vh}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(circle at 50% 15%,rgba(249,115,22,.18),transparent 60%)}
.logo-img{width:120px;height:120px;border-radius:26px;object-fit:cover;margin-bottom:14px;box-shadow:0 8px 30px rgba(249,115,22,.4);animation:fadeUp .5s ease}
h1{font-size:28px;letter-spacing:1px;animation:fadeUp .6s ease}
h1 span{color:#f97316}
.subtitle{color:#9ca3af;margin:6px 0 26px;font-size:14px}
.input{width:100%;max-width:340px;background:#141e30;border:1px solid #22304a;border-radius:10px;padding:13px;color:#fff;font-size:15px;margin-bottom:12px;outline:none}
.input:focus{border-color:#f97316}
.btn{border:none;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;transition:.15s}
.btn:active{transform:scale(.96)}
.btn-green{background:linear-gradient(135deg,#f97316,#ea580c);width:100%;max-width:340px}
.btn-blue{background:#2563eb}
.btn-red{background:#dc2626}
.btn-yellow{background:#d97706}
.btn-viewer{background:transparent;border:1px solid #22304a;color:#9ca3af;margin-top:12px;width:100%;max-width:340px}
#loginError{color:#f87171;font-size:13px;margin-bottom:10px;display:none;text-align:center;max-width:340px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#101a2c;border-bottom:1px solid #22304a}
header img{width:40px;height:40px;border-radius:10px;object-fit:cover}
nav{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#0b1220;position:sticky;top:0;z-index:5}
.tab{background:#141e30;border:1px solid #22304a;color:#9ca3af;border-radius:20px;padding:8px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.tab.active{background:#f97316;border-color:#f97316;color:#fff}
main{padding:16px;max-width:700px;margin:0 auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#141e30;border:1px solid #22304a;border-radius:14px;padding:16px;text-align:center;animation:fadeUp .4s ease}
.stat b{font-size:26px;display:block}
.stat span{color:#9ca3af;font-size:12px}
#stTotal{color:#f97316}#stRoute{color:#3b82f6}#stDelivered{color:#22c55e}#stNoAnswer{color:#ef4444}
.card{background:#141e30;border:1px solid #22304a;border-left:4px solid #374151;border-radius:14px;padding:14px;margin-bottom:12px;animation:fadeUp .35s ease;cursor:pointer}
.card.s-pending{border-left-color:#6b7280}
.card.s-in_route{border-left-color:#2563eb}
.card.s-delivered{border-left-color:#16a34a}
.card.s-no_answer{border-left-color:#dc2626}
.card.s-postponed{border-left-color:#d97706}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.code{color:#fbbf24;font-weight:700;font-size:13px;margin-bottom:6px}
.line{color:#d1d5db;font-size:13px;margin-bottom:4px}
.badge{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600}
.badge.pending{background:#374151;color:#d1d5db}
.badge.in_route{background:#1e40af;color:#fff}
.badge.delivered{background:#14532d;color:#86efac}
.badge.no_answer{background:#7f1d1d;color:#fca5a5}
.badge.postponed{background:#78350f;color:#fcd34d}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.day{color:#fbbf24;font-size:14px;margin:18px 0 10px;text-transform:capitalize}
.empty{color:#6b7280;text-align:center;padding:30px;font-size:14px}
.fab{position:fixed;bottom:22px;right:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ea580c);font-size:26px;border:none;color:#fff;box-shadow:0 6px 20px rgba(249,115,22,.5);z-index:15;display:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:#16a34a;color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;font-size:14px;transition:.3s;z-index:50;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#postponeModal,#newModal,#detailModal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{background:#141e30;border:1px solid #22304a;border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:85vh;overflow-y:auto}
.modal h3{margin-bottom:14px;font-size:16px}
.dline{padding:8px 0;border-bottom:1px solid #22304a;font-size:14px}
.dline b{color:#f97316;display:block;font-size:12px;margin-bottom:2px}
.act{background:#141e30;border:1px solid #22304a;border-radius:12px;padding:12px;margin-bottom:10px;animation:fadeUp .3s ease}
.act small{color:#6b7280;display:block;margin-top:4px;font-size:11px}
</style>
</head>
<body>

<div id="loginScreen">
<img src="logo.png.PNG" class="logo-img" alt="Llega Ya">
<h1>LLEGA <span>YA</span></h1>
<p class="subtitle">Sistema de Gestión de Entregas</p>
<input class="input" id="loginEmail" type="email" placeholder="Correo Electrónico" autocomplete="username">
<input class="input" id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password">
<p id="loginError">Credenciales incorrectas</p>
<button class="btn btn-green" onclick="handleLogin()">Iniciar Sesión</button>
<button class="btn btn-viewer" onclick="handleViewerLogin()">👁️ Entrar como Visualizador</button>
</div>

<div id="appInterface" style="display:none">
<header>
<div style="display:flex;align-items:center;gap:10px">
<img src="logo.png.PNG" alt="LY">
<div><div id="userName" style="font-weight:700"></div><div id="roleDisplay" style="font-size:12px;color:#9ca3af"></div></div>
</div>
<button class="btn btn-red" onclick="logout()">Salir</button>
</header>
<nav>
<button class="tab active" data-sec="dashboard" onclick="navigateTo('dashboard')">Dashboard</button>
<button class="tab" data-sec="rutas" onclick="navigateTo('rutas')">Rutas</button>
<button class="tab" data-sec="entregados" onclick="navigateTo('entregados')">Entregados</button>
<button class="tab" data-sec="nocontesta" onclick="navigateTo('nocontesta')">No Contesta</button>
<button class="tab" data-sec="pospuestos" onclick="navigateTo('pospuestos')">Pospuestos</button>
<button class="tab" data-sec="actividad" onclick="navigateTo('actividad')">Actividad</button>
<button class="tab" data-sec="equipo" onclick="navigateTo('equipo')">Equipo</button>
</nav>
<main>
<section id="sec-dashboard">
<div class="stats">
<div class="stat"><b id="stTotal">0</b><span>📦 Total Paquetes</span></div>
<div class="stat"><b id="stRoute">0</b><span>🚚 En Ruta</span></div>
<div class="stat"><b id="stDelivered">0</b><span>✅ Entregados</span></div>
<div class="stat"><b id="stNoAnswer">0</b><span>❌ No Contesta</span></div>
</div>
<button class="btn btn-green" style="width:100%;margin-top:14px;max-width:none" onclick="loadPackages()">🔄 Actualizar</button>
</section>
<section id="sec-rutas" style="display:none"><div id="rutasList"></div></section>
<section id="sec-entregados" style="display:none"><div id="entregadosList"></div></section>
<section id="sec-nocontesta" style="display:none"><div id="nocontestaList"></div></section>
<section id="sec-pospuestos" style="display:none"><div id="pospuestosList"></div></section>
<section id="sec-actividad" style="display:none"><div id="actList"></div></section>
<section id="sec-equipo" style="display:none">
<div class="modal" style="max-width:none;border:none;padding:0;background:transparent">
<h3>➕ Nuevo usuario</h3>
<input class="input" id="uName" placeholder="Nombre" style="max-width:none">
<input class="input" id="uEmail" type="email" placeholder="Correo" style="max-width:none">
<input class="input" id="uPass" placeholder="Contraseña" style="max-width:none">
<button class="btn btn-green" style="max-width:none" onclick="createUser()">Crear usuario</button>
</div>
<h3 class="day">Mi equipo</h3>
<div id="teamList"></div>
</section>
</main>
</div>

<button id="btnNew" class="fab" onclick="openNew()">＋</button>
<div id="toast"></div>

<div id="postponeModal">
<div class="modal">
<h3>📅 Pospuesto para el día:</h3>
<input type="date" class="input" id="postponeDate" style="max-width:none">
<button class="btn btn-green" style="max-width:none" onclick="confirmPostpone()">Confirmar</button>
<button class="btn btn-viewer" style="max-width:none;margin-top:8px" onclick="closePostpone()">Cancelar</button>
</div>
</div>

<div id="newModal">
<div class="modal">
<h3>📦 Nuevo Paquete</h3>
<input class="input" id="nCode" placeholder="Código (ej: PKG-002)" style="max-width:none">
<input class="input" id="nName" placeholder="Nombre del cliente" style="max-width:none">
<input class="input" id="nPhone" placeholder="Teléfono" style="max-width:none">
<input class="input" id="nAddress" placeholder="Dirección" style="max-width:none">
<input class="input" id="nNotes" placeholder="¿Qué contiene?" style="max-width:none">
<input class="input" id="nPrice" type="number" placeholder="Precio (RD$)" style="max-width:none">
<input class="input" id="nAssigned" placeholder="Asignado a" style="max-width:none">
<button class="btn btn-green" style="max-width:none" onclick="saveNew()">Guardar</button>
<button class="btn btn-viewer" style="max-width:none;margin-top:8px" onclick="closeNew()">Cancelar</button>
</div>
</div>

<div id="detailModal">
<div class="modal">
<div id="detailBody"></div>
<button class="btn btn-green" style="max-width:none;margin-top:14px" onclick="closeDetail()">Cerrar</button>
</div>
</div>

<script>
// --- CONFIGURACIÓN ---
const SUPABASE_URL = 'https://dapvmekijnbwpqxbnbbl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XsyBKIPoXaWtkK8NtNCSt-Q_pzDoV9ZT'; 
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let packages=[], currentUser=null, pendingPostpone=null;

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDay(s){if(!s)return'Sin fecha';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'});}
function fmtDT(s){if(!s)return'';const d=new Date(s);return d.toLocaleDateString('es-DO',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'});}
function statusLabel(s){return{pending:'Pendiente',in_route:'En Ruta',delivered:'Entregado',no_answer:'No Contesta',postponed:'Pospuesto'}[s]||s;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function logAct(texto){if(currentUser){sb.from('activity').insert({texto:texto,usuario:currentUser.name}).then();}}

async function handleLogin(){
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    
    err.style.display = 'block';
    err.style.color = '#fbbf24';
    err.textContent = 'Conectando...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

    if (error) {
        console.error('Login Error:', error);
        err.style.color = '#f87171';
        // Mensaje amigable según el error
        if(error.message.includes('Invalid login credentials')) {
            err.textContent = 'Correo o contraseña incorrectos.';
        } else if (error.message.includes('Email not confirmed')) {
            err.textContent = 'Debes confirmar tu correo primero.';
        } else {
            err.textContent = 'Error: ' + error.message;
        }
        return;
    }

    if (data && data.user) {
        let role = 'employee';
        let name = email.split('@')[0];
        
        // Verificar si es admin o está en la tabla team
        if (email === 'admin@llegaya.com') {
            role = 'owner';
            name = 'Dueño';
        } else {
            const { data: tm } = await sb.from('team').select('*').eq('email', email).maybeSingle();
            if (!tm) {
                await sb.auth.signOut();
                err.style.color = '#f87171';
                err.textContent = 'Usuario no autorizado. Contacta al administrador.';
                return;
            }
            role = tm.role || 'employee';
            name = tm.name || name;
        }
        loginUser(name, email, role);
    }
}

function handleViewerLogin(){ loginUser('Visualizador', 'viewer@temp.com', 'viewer'); }

function loginUser(name, email, role){
    currentUser = { name, email, role };
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appInterface').style.display = 'block';
    document.getElementById('userName').textContent = name;
    document.getElementById('roleDisplay').textContent = role==='owner'?'Administrador':(role==='employee'?'Empleado':'Solo Lectura');
    
    // Configurar pestañas según rol
    document.querySelectorAll('.tab').forEach(t => {
        const s = t.dataset.sec;
        if(role === 'viewer' && s !== 'entregados' && s !== 'nocontesta') t.style.display = 'none';
        if(role !== 'owner' && s === 'equipo') t.style.display = 'none';
    });

    if(role !== 'viewer') document.getElementById('btnNew').style.display = 'block';
    if(role === 'viewer') navigateTo('entregados');
    
    loadPackages();
}

async function logout(){ await sb.auth.signOut(); location.reload(); }

async function loadPackages(){
    const { data, error } = await sb.from('packages').select('*');
    if(!error) packages = data || [];
    renderAll();
}

async function updatePkg(id, changes, msg){
    const pkg = packages.find(x => x.id === id);
    const { error } = await sb.from('packages').update(changes).eq('id', id);
    if(error){ alert('Error: ' + error.message); return; }
    logAct(msg + ' • ' + (pkg ? pkg.tracking_code || pkg.client_name : ''));
    toast(msg || '✅ Guardado');
    loadPackages();
}

function markInRoute(id){ updatePkg(id, {status:'in_route'}, '🚚 En ruta'); }
function markDelivered(id){ updatePkg(id, {status:'delivered', completed_date:todayStr()}, '✅ Entregado'); }
function markNoAnswer(id){ updatePkg(id, {status:'no_answer', completed_date:todayStr()}, '❌ No contesta'); }
function reactivate(id){ updatePkg(id, {status:'pending'}, '🚚 Enviado a rutas'); }

function openPostpone(id){ pendingPostpone=id; document.getElementById('postponeModal').style.display='flex'; }
function closePostpone(){ document.getElementById('postponeModal').style.display='none'; pendingPostpone=null; }
function confirmPostpone(){
    const d = document.getElementById('postponeDate').value;
    if(pendingPostpone) updatePkg(pendingPostpone, {status:'postponed', scheduled_date:d||null}, ' Pospuesto');
    closePostpone();
}

function openNew(){ document.getElementById('newModal').style.display='flex'; }
function closeNew(){ document.getElementById('newModal').style.display='none'; }

async function saveNew(){
    const name = document.getElementById('nName').value.trim();
    if(!name){ toast('⚠️ Pon el nombre del cliente'); return; }
    const price = document.getElementById('nPrice').value;
    
    const { error } = await sb.from('packages').insert({
        tracking_code: document.getElementById('nCode').value.trim(),
        client_name: name,
        client_phone: document.getElementById('nPhone').value.trim(),
        client_address: document.getElementById('nAddress').value.trim(),
        notes: document.getElementById('nNotes').value.trim() || null,
        price: price ? Number(price) : null,
        assigned_to: document.getElementById('nAssigned').value.trim() || null,
        status: 'pending'
    });
    
    if(error){ alert('Error: ' + error.message); return; }
    ['nCode','nName','nPhone','nAddress','nNotes','nPrice','nAssigned'].forEach(i => document.getElementById(i).value='');
    logAct('📦 Paquete nuevo: ' + name);
    closeNew(); toast('📦 Paquete agregado'); loadPackages();
}

function closeDetail(){ document.getElementById('detailModal').style.display='none'; }

function openDetail(id){
    const p = packages.find(x => x.id === id); if(!p) return;
    function L(t,v){ return v ? '<div class="dline"><b>'+t+'</b>'+v+'</div>' : ''; }
    
    let h = '<h3>📦 ' + (p.tracking_code || 'Sin código') + '</h3>';
    h += L('Estado', statusLabel(p.status));
    h += L('Cliente', p.client_name);
    h += L('Teléfono', p.client_phone);
    h += L('Dirección', p.client_address);
    h += L('Contenido', p.notes);
    h += L('Precio', p.price != null ? 'RD$'+p.price : null);
    h += L('Asignado a', p.assigned_to);
    h += L('Registrado', fmtDT(p.created_at));
    h += L('Programado para', p.scheduled_date ? fmtDay(p.scheduled_date) : (p.delivery_date ? fmtDay(p.delivery_date) : null));
    
    if(p.status === 'delivered') h += L('Recibido', '✅ Sí, el ' + fmtDay(p.completed_date));
    if(p.status === 'no_answer') h += L('Resultado', '❌ No contestó, el ' + fmtDay(p.completed_date));
    if(p.status === 'postponed') h += L('Resultado', '📅 Pospuesto');
    
    document.getElementById('detailBody').innerHTML = h;
    document.getElementById('detailModal').style.display = 'flex';
}

async function createUser(){
    const name = document.getElementById('uName').value.trim();
    const email = document.getElementById('uEmail').value.trim().toLowerCase();
    const pass = document.getElementById('uPass').value;
    
    if(!name || !email || pass.length < 6){ toast('⚠️ Completa todos los campos (mín 6 caracteres)'); return; }
    
    // 1. Crear en tabla team
    const { error: e1 } = await sb.from('team').insert({ email, name, role: 'employee' });
    if(e1){ alert('Error al registrar en equipo: ' + e1.message); return; }
    
    // 2. Crear usuario en Auth
    const { error: e2 } = await sb.auth.signUp({ email, password: pass });
    if(e2){ alert('Error al crear cuenta: ' + e2.message); return; }
    
    logAct('👥 Usuario creado: ' + email);
    await sb.auth.signOut();
    alert(' Usuario creado exitosamente.\n\nPor favor, inicia sesión nuevamente con tu cuenta de administrador.');
    location.reload();
}

async function delUser(email){
    if(!confirm('¿Eliminar a ' + email + '? Ya no podrá entrar.')) return;
    const { error } = await sb.from('team').delete().eq('email', email);
    if(error){ alert('Error: ' + error.message); return; }
    logAct('🗑️ Usuario eliminado: ' + email);
    toast('🗑️ Usuario eliminado');
    loadTeam();
}

async function loadTeam(){
    const { data } = await sb.from('team').select('*').order('created_at');
    const list = data || [];
    document.getElementById('teamList').innerHTML = list.length ? 
        list.map(u => '<div class="act"><b>'+u.name+'</b> · '+u.email+'<div class="actions"><button class="btn btn-red" onclick="delUser(\''+u.email+'\')">🗑️ Eliminar</button></div></div>').join('') 
        : '<p class="empty">Sin empleados registrados</p>';
}

async function loadActivity(){
    const { data } = await sb.from('activity').select('*').order('created_at', {ascending:false}).limit(50);
    const list = data || [];
    document.getElementById('actList').innerHTML = list.length ? 
        list.map(a => '<div class="act">'+a.texto+'<small>'+a.usuario+' · '+fmtDT(a.created_at)+'</small></div>').join('') 
        : '<p class="empty">Sin actividad todavía</p>';
}

function cardHTML(p, actions){
    return '<div class="card s-'+p.status+'" onclick="openDetail(\''+p.id+'\')"><div class="card-top"><b>'+(p.client_name||'Sin nombre')+'</b><span class="badge '+p.status+'">'+statusLabel(p.status)+'</span></div>'
    +'<div class="code">'+(p.tracking_code||'')+'</div>'
    +'<div class="line">📞 '+(p.client_phone||'-')+'</div>'
    +'<div class="line">📍 '+(p.client_address||'-')+'</div>'
    +(p.price!=null?'<div class="line">💵 RD$'+p.price+'</div>':'')
    +(actions||'')+'</div>';
}

function routeActions(p){
    if(currentUser.role==='viewer') return '';
    let a = '<div class="actions">';
    if(p.status==='pending') a += '<button class="btn btn-blue" onclick="event.stopPropagation();markInRoute(\''+p.id+'\')"> En Ruta</button>';
    a += '<button class="btn btn-green" onclick="event.stopPropagation();markDelivered(\''+p.id+'\')">✅ Entregado</button>';
    a += '<button class="btn btn-red" onclick="event.stopPropagation();markNoAnswer(\''+p.id+'\')">❌ No Contesta</button>';
    a += '<button class="btn btn-yellow" onclick="event.stopPropagation();openPostpone(\''+p.id+'\')">📅 Pospuesto</button>';
    return a+'</div>';
}

function groupBy(list, key){
    const g = {};
    list.forEach(p => { const k = p[key] || 'sin'; (g[k] = g[k] || []).push(p); });
    return g;
}

function renderGroup(status, key, elId){
    const g = groupBy(packages.filter(p => p.status === status), key);
    const keys = Object.keys(g).sort().reverse();
    let html = '';
    keys.forEach(k => {
        html += '<h3 class="day">' + (k === 'sin' ? 'Sin fecha' : fmtDay(k)) + '</h3>';
        html += g[k].map(p => cardHTML(p, '')).join('');
    });
    document.getElementById(elId).innerHTML = html || '<p class="empty">Vacío</p>';
}

function renderRutas(){
    const list = packages.filter(p => p.status === 'pending' || p.status === 'in_route');
    document.getElementById('rutasList').innerHTML = list.length ? 
        list.map(p => cardHTML(p, routeActions(p))).join('') 
        : '<p class="empty">No hay paquetes en ruta</p>';
}

function renderPospuestos(){
    const g = groupBy(packages.filter(p => p.status === 'postponed'), 'scheduled_date');
    const keys = Object.keys(g).sort();
    let html = '';
    keys.forEach(k => {
        html += '<h3 class="day">' + (k === 'sin' ? 'Sin fecha' : fmtDay(k)) + '</h3>';
        html += g[k].map(p => cardHTML(p, currentUser.role !== 'viewer' ? 
            '<div class="actions"><button class="btn btn-blue" onclick="event.stopPropagation();reactivate(\''+p.id+'\')">🚚 Enviar a Rutas</button><button class="btn btn-yellow" onclick="event.stopPropagation();openPostpone(\''+p.id+'\')">📅 Cambiar día</button></div>' 
            : '')).join('');
    });
    document.getElementById('pospuestosList').innerHTML = html || '<p class="empty">No hay pospuestos</p>';
}

function renderStats(){
    document.getElementById('stTotal').textContent = packages.length;
    document.getElementById('stRoute').textContent = packages.filter(p => p.status === 'pending' || p.status === 'in_route').length;
    document.getElementById('stDelivered').textContent = packages.filter(p => p.status === 'delivered').length;
    document.getElementById('stNoAnswer').textContent = packages.filter(p => p.status === 'no_answer').length;
}

function renderAll(){
    renderStats();
    renderRutas();
    renderGroup('delivered', 'completed_date', 'entregadosList');
    renderGroup('no_answer', 'completed_date', 'nocontestaList');
    renderPospuestos();
}

function navigateTo(sec){
    ['dashboard','rutas','entregados','nocontesta','pospuestos','actividad','equipo'].forEach(s => {
        document.getElementById('sec-'+s).style.display = (s === sec) ? 'block' : 'none';
    });
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.sec === sec));
    if(sec === 'actividad') loadActivity();
    if(sec === 'equipo') loadTeam();
}
</script>
</body>
</html>
