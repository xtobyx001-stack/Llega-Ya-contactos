<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llega-Ya | Sistema de Gestión de Entregas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh}
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.logo{width:70px;height:70px;background:#16a34a;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:14px}
h1{font-size:26px;letter-spacing:1px}
.subtitle{color:#9ca3af;margin:6px 0 26px;font-size:14px}
.input{width:100%;max-width:340px;background:#171717;border:1px solid #333;border-radius:10px;padding:13px;color:#fff;font-size:15px;margin-bottom:12px;outline:none}
.input:focus{border-color:#16a34a}
.btn{border:none;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:600;cursor:pointer;color:#fff}
.btn-green{background:#16a34a;width:100%;max-width:340px}
.btn-blue{background:#2563eb}
.btn-red{background:#dc2626}
.btn-yellow{background:#d97706}
.btn-viewer{background:transparent;border:1px solid #333;color:#9ca3af;margin-top:12px;width:100%;max-width:340px}
#loginError{color:#f87171;font-size:13px;margin-bottom:10px;display:none}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#111;border-bottom:1px solid #222}
nav{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#0a0a0a;position:sticky;top:0;z-index:5}
.tab{background:#171717;border:1px solid #333;color:#9ca3af;border-radius:20px;padding:8px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.tab.active{background:#16a34a;border-color:#16a34a;color:#fff}
main{padding:16px;max-width:700px;margin:0 auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#171717;border:1px solid #222;border-radius:14px;padding:16px;text-align:center}
.stat b{font-size:26px;display:block;color:#16a34a}
.stat span{color:#9ca3af;font-size:12px}
.card{background:#171717;border:1px solid #222;border-radius:14px;padding:14px;margin-bottom:12px}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.code{color:#16a34a;font-weight:700;font-size:13px;margin-bottom:6px}
.line{color:#d1d5db;font-size:13px;margin-bottom:4px}
.badge{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600}
.badge.pending{background:#374151;color:#d1d5db}
.badge.in_route{background:#1e40af;color:#fff}
.badge.delivered{background:#14532d;color:#86efac}
.badge.no_answer{background:#7f1d1d;color:#fca5a5}
.badge.postponed{background:#78350f;color:#fcd34d}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.day{color:#16a34a;font-size:14px;margin:18px 0 10px;text-transform:capitalize}
.empty{color:#6b7280;text-align:center;padding:30px;font-size:14px}
#postponeModal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{background:#171717;border:1px solid #333;border-radius:16px;padding:20px;width:100%;max-width:340px}
.modal h3{margin-bottom:14px;font-size:16px}
</style>
</head>
<body>

<div id="loginScreen">
<div class="logo">LY</div>
<h1>LLEGA YA</h1>
<p class="subtitle">Sistema de Gestión de Entregas</p>
<input class="input" id="loginEmail" type="email" placeholder="Correo Electrónico" autocomplete="username">
<input class="input" id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password">
<p id="loginError">Credenciales incorrectas</p>
<button class="btn btn-green" onclick="handleLogin()">Iniciar Sesión</button>
<button class="btn btn-viewer" onclick="handleViewerLogin()">👁️ Entrar como Visualizador</button>
</div>

<div id="appInterface" style="display:none">
<header>
<div><div id="userName" style="font-weight:700"></div><div id="roleDisplay" style="font-size:12px;color:#9ca3af"></div></div>
<button class="btn btn-red" onclick="logout()">Salir</button>
</header>
<nav>
<button class="tab active" data-sec="dashboard" onclick="navigateTo('dashboard')">Dashboard</button>
<button class="tab" data-sec="rutas" onclick="navigateTo('rutas')">Rutas</button>
<button class="tab" data-sec="entregados" onclick="navigateTo('entregados')">Entregados</button>
<button class="tab" data-sec="nocontesta" onclick="navigateTo('nocontesta')">No Contesta</button>
<button class="tab" data-sec="pospuestos" onclick="navigateTo('pospuestos')">Pospuestos</button>
</nav>
<main>
<section id="sec-dashboard">
<div class="stats">
<div class="stat"><b id="stTotal">0</b><span>Total Paquetes</span></div>
<div class="stat"><b id="stRoute">0</b><span>En Ruta</span></div>
<div class="stat"><b id="stDelivered">0</b><span>Entregados</span></div>
<div class="stat"><b id="stNoAnswer">0</b><span>No Contesta</span></div>
</div>
<button class="btn btn-green" style="width:100%;margin-top:14px;max-width:none" onclick="loadPackages()">🔄 Actualizar</button>
</section>
<section id="sec-rutas" style="display:none"><div id="rutasList"></div></section>
<section id="sec-entregados" style="display:none"><div id="entregadosList"></div></section>
<section id="sec-nocontesta" style="display:none"><div id="nocontestaList"></div></section>
<section id="sec-pospuestos" style="display:none"><div id="pospuestosList"></div></section>
</main>
</div>

<div id="postponeModal">
<div class="modal">
<h3>📅 Pospuesto para el día:</h3>
<input type="date" class="input" id="postponeDate" style="max-width:none">
<button class="btn btn-green" style="max-width:none" onclick="confirmPostpone()">Confirmar</button>
<button class="btn btn-viewer" style="max-width:none;margin-top:8px" onclick="closePostpone()">Cancelar</button>
</div>
</div>

<script>
const SUPABASE_URL='https://dapvmekijnbwpqxbnbbl.supabase.co';
const SUPABASE_KEY='sb_publishable_XsyBKIPoXaWtkK8NtNCSt-Q_pzDoV9ZT';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let packages=[],currentUser=null,pendingPostpone=null;

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDay(s){if(!s)return'Sin fecha';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long'});}
function statusLabel(s){return{pending:'Pendiente',in_route:'En Ruta',delivered:'Entregado',no_answer:'No Contesta',postponed:'Pospuesto'}[s]||s;}

async function handleLogin(){
const email=document.getElementById('loginEmail').value.trim().toLowerCase();
const pass=document.getElementById('loginPass').value;
const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
if(error){document.getElementById('loginError').style.display='block';return;}
let role='employee',name=email.split('@')[0];
name=name.charAt(0).toUpperCase()+name.slice(1);
if(email==='admin@llegaya.com'){role='owner';name='Dueño';}
loginUser(name,email,role);
}
function handleViewerLogin(){loginUser('Visualizador','solo lectura','viewer');}
function loginUser(name,email,role){
currentUser={name,email,role};
document.getElementById('loginScreen').style.display='none';
document.getElementById('appInterface').style.display='block';
document.getElementById('userName').textContent=name;
document.getElementById('roleDisplay').textContent=role==='owner'?'Administrador':(role==='employee'?'Empleado':'Solo Lectura');
loadPackages();
}
async function logout(){await sb.auth.signOut();location.reload();}

async function loadPackages(){
const {data,error}=await sb.from('packages').select('*');
if(!error){packages=data||[];}
renderAll();
}
async function updatePkg(id,changes){
const {error}=await sb.from('packages').update(changes).eq('id',id);
if(error){alert('Error: '+error.message);return;}
loadPackages();
}
function markInRoute(id){updatePkg(id,{status:'in_route'});}
function markDelivered(id){updatePkg(id,{status:'delivered',completed_date:todayStr()});}
function markNoAnswer(id){updatePkg(id,{status:'no_answer',completed_date:todayStr()});}
function reactivate(id){updatePkg(id,{status:'pending'});}
function openPostpone(id){pendingPostpone=id;document.getElementById('postponeModal').style.display='flex';}
function closePostpone(){document.getElementById('postponeModal').style.display='none';pendingPostpone=null;}
function confirmPostpone(){
const d=document.getElementById('postponeDate').value;
if(pendingPostpone){updatePkg(pendingPostpone,{status:'postponed',scheduled_date:d||null});}
closePostpone();
}

function cardHTML(p,actions){
return '<div class="card"><div class="card-top"><b>'+(p.client_name||'Sin nombre')+'</b><span class="badge '+p.status+'">'+statusLabel(p.status)+'</span></div>'
+'<div class="code">'+(p.tracking_code||'')+'</div>'
+'<div class="line">📞 '+(p.client_phone||'-')+'</div>'
+'<div class="line">📍 '+(p.client_address||'-')+'</div>'
+(p.notes?'<div class="line">📝 '+p.notes+'</div>':'')
+(p.price!=null?'<div class="line">💵 RD$'+p.price+'</div>':'')
+(p.assigned_to?'<div class="line">👤 '+p.assigned_to+'</div>':'')
+(actions||'')+'</div>';
}
function routeActions(p){
if(currentUser.role==='viewer')return'';
let a='<div class="actions">';
if(p.status==='pending')a+='<button class="btn btn-blue" onclick="markInRoute(\''+p.id+'\')">🚚 En Ruta</button>';
a+='<button class="btn btn-green" onclick="markDelivered(\''+p.id+'\')">✅ Entregado</button>';
a+='<button class="btn btn-red" onclick="markNoAnswer(\''+p.id+'\')">❌ No Contesta</button>';
a+='<button class="btn btn-yellow" onclick="openPostpone(\''+p.id+'\')">📅 Pospuesto</button>';
return a+'</div>';
}
function groupBy(list,key){const g={};list.forEach(p=>{const k=p[key]||'sin';(g[k]=g[k]||[]).push(p);});return g;}
function renderGroup(status,key,elId){
const g=groupBy(packages.filter(p=>p.status===status),key);
const keys=Object.keys(g).sort().reverse();
let html='';
keys.forEach(k=>{html+='<h3 class="day">'+(k==='sin'?'Sin fecha':fmtDay(k))+'</h3>';html+=g[k].map(p=>cardHTML(p,'')).join('');});
document.getElementById(elId).innerHTML=html||'<p class="empty">Vacío</p>';
}
function renderRutas(){
const list=packages.filter(p=>p.status==='pending'||p.status==='in_route');
document.getElementById('rutasList').innerHTML=list.length?list.map(p=>cardHTML(p,routeActions(p))).join(''):'<p class="empty">No hay paquetes en ruta</p>';
}
function renderPospuestos(){
const g=groupBy(packages.filter(p=>p.status==='postponed'),'scheduled_date');
const keys=Object.keys(g).sort();
let html='';
keys.forEach(k=>{
html+='<h3 class="day">'+(k==='sin'?'Sin fecha':fmtDay(k))+'</h3>';
html+=g[k].map(p=>cardHTML(p,currentUser.role!=='viewer'?'<div class="actions"><button class="btn btn-blue" onclick="reactivate(\''+p.id+'\')">🚚 Enviar a Rutas</button><button class="btn btn-yellow" onclick="openPostpone(\''+p.id+'\')">📅 Cambiar día</button></div>':'')).join('');
});
document.getElementById('pospuestosList').innerHTML=html||'<p class="empty">No hay pospuestos</p>';
}
function renderStats(){
document.getElementById('stTotal').textContent=packages.length;
document.getElementById('stRoute').textContent=packages.filter(p=>p.status==='pending'||p.status==='in_route').length;
document.getElementById('stDelivered').textContent=packages.filter(p=>p.status==='delivered').length;
document.getElementById('stNoAnswer').textContent=packages.filter(p=>p.status==='no_answer').length;
}
function renderAll(){renderStats();renderRutas();renderGroup('delivered','completed_date','entregadosList');renderGroup('no_answer','completed_date','nocontestaList');renderPospuestos();}
function navigateTo(sec){
['dashboard','rutas','entregados','nocontesta','pospuestos'].forEach(s=>{document.getElementById('sec-'+s).style.display=(s===sec)?'block':'none';});
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sec===sec));
}
</script>
</body>
</html>
